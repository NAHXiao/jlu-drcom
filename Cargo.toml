[profile.release]
strip = "symbols" 
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"    
[package]
name = "drcomrs"
version = "0.1.0"
edition = "2021"
[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_yaml = "0.9"
md-5 = "0.10"
hex = "0.4"
rpassword = "7.2"
dirs = "6.0"
socket2 = "0.5"
mac_address = "1.1"
reqwest = { version = "0.12", features = ["blocking"] }
log = "0.4"
thiserror = "2.0"
ctrlc = "3.2"
rand = "0.9.1"
getifs = "0.3"
base64 = "0.22"
machine-uid = "0.5.3"
aes = "0.8"
tinycrypt = "0.1.0"
once_cell = "1.21.3"
simplelog='0.12.2'
