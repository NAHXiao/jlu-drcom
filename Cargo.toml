[package]
name = "drcomrs"
version = "0.1.0"
edition = "2021"
[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_yaml = "0.9"
md-5 = "0.10"
hex = "0.4"
rpassword = "7.2"
dirs = "5.0"
clap = { version = "4.3", features = ["derive"] }
socket2 = "0.5"
get_if_addrs = "0.5"
mac_address = "1.1"
reqwest = { version = "0.11", features = ["blocking"] }
log = "0.4"
env_logger = "0.10"
thiserror = "1.0"
anyhow = "1.0"
crossterm = "0.26"
ctrlc = "3.2"
rand = "0.9.1"
getifs = "0.3"
chacha20poly1305 = { version = "0.10", features = ["rand_core"] }
base64 = "0.21"
sha2 = "0.10"
machine-uid = "0.5.3"
aes = "0.8"
block-modes = "0.8"
block-padding = "0.2"
tinycrypt = "0.1.0"
once_cell = "1.21.3"
